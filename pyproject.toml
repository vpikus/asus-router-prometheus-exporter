[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asus-router-exporter"
version = "2.0.0"
description = "Prometheus exporter for ASUS routers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "prometheus-client>=0.15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
asus-router-exporter = "asus_router_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "F403",  # star imports - allowed for models/parsing modules
    "F405",  # names from star imports - consequence of F403
    "E501",  # line too long - handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"src/asus_router_exporter/client/router_client.py" = ["F403", "F405"]
"tests/*" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["asus_router_exporter"]
