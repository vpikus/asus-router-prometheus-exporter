global:
  scrape_interval: 5s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'asus-router-exporter'
    static_configs:
      - targets: ['asus-router-exporter:8000']
    scrape_interval: 2s
    scrape_timeout: 2s
